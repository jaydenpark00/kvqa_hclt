# =====================================================================================
# Ours-DirectAS  —  NEW experimental condition (KVQA final experiment)
# -------------------------------------------------------------------------------------
# Purpose: reduce answer exposure AT THE SOURCE instead of deleting it post-hoc.
#   Stage 1'  protected_decomposition : QUESTION only  -> 9-key observation spec JSON
#             (adds observation_target / protected_answer_value / evidence_to_preserve
#              on top of the frozen 6-key schema; NO image, NO gold, NO answer guessing)
#   Stage 2'  protected_evidence      : IMAGE + protected decomposition
#             -> directly answer-suppressed visual guidance
#             (NO original question, NO gold; NO Stage-3 suppressor afterwards)
#
# This file is ADDITIVE. It does NOT modify and is NOT read by:
#   configs/gqa_final_hclt_vs_ours_as_2k.yaml   (frozen Generic / HCLT / Ours-Raw / Ours-AS)
#   configs/kvqa_final_hclt_vs_ours_as_2k.yaml  (frozen KVQA experiment config)
# The frozen Ours-Raw / Ours-AS pipeline (decomp -> raw -> supp) is untouched.
#
# Comparability: the new condition MUST use the same 2K sample manifest
#   outputs/kvqa_final_hclt_vs_ours_as_2k/manifest.jsonl
# and, for sanity, the same fixed 30 ids
#   outputs/kvqa_final_hclt_vs_ours_as_2k/_sanity30_archive/_sanity30_manifest.jsonl
#
# Backbone / decoding / solver / evaluator / leakage detector: unchanged (frozen).
# =====================================================================================
condition: ours_directas
base_frozen_config: configs/gqa_final_hclt_vs_ours_as_2k.yaml
sample_manifest: outputs/kvqa_final_hclt_vs_ours_as_2k/manifest.jsonl
sanity_manifest: outputs/kvqa_final_hclt_vs_ours_as_2k/_sanity30_archive/_sanity30_manifest.jsonl

# revision history (rule-level only; never sample-tuned):
#   r1  initial DirectAS prompts (30-sample sanity #1).
#   r2  ONE re-freeze after sanity #1, limited to two answer-type CATEGORIES:
#       (a) Stage 2 state/action/yes_no: forbid combining a state-asserting predicate
#           ("있다/없다/켜져 있다/우거져 있다/불투명하다/높다"...) with a confirmatory verb
#           ("확인할 수 있다/보인다/것으로 보인다"); principle 8 also bars existence/state verdicts.
#       (b) Stage 1 answer_type + Stage 2 text: date / expiry / product-code / price / serial
#           strings are `text` and must not be transcribed.
#       No per-sample edits; the 30 sanity ids were not referenced while editing.
revision: r2

# ---------------------------------------------------------------------------------------
# Stage 1'  —  PROTECTED DECOMPOSITION  (text-only; input = the question string only)
#   placeholders allowed: {question}
# ---------------------------------------------------------------------------------------
protected_decomposition:
  max_new_tokens: 320
  instruction: |
    한국어 시각 질문을, 이미지에서 무엇을 관찰해야 하는지와 어떤 값을 증거 텍스트에 직접 노출하면 안 되는지를 나타내는 JSON으로 분해하세요. 이미지는 주어지지 않습니다. 정답이나 이미지 내용을 추측하지 마세요.

    반드시 아래 9개 키를 정확히 한 번씩 모두 출력하세요. 값이 없더라도 키를 생략하지 말고 null을 출력하세요(evidence_to_preserve는 값이 없으면 빈 배열 []). JSON 앞뒤에 설명이나 코드 펜스를 붙이지 마세요.

    {
      "target_object": null,
      "reference_object": null,
      "relation_to_check": null,
      "requested_property": null,
      "state_or_action_to_check": null,
      "answer_type": "other",
      "observation_target": null,
      "protected_answer_value": null,
      "evidence_to_preserve": []
    }

    작성 규칙:
    - target_object: 질문에서 확인할 주요 대상. "이것/이게"뿐이면 "이미지에서 지시된 주요 객체"라고 쓰고 객체 정답을 추측하지 마세요.
    - reference_object: 대상을 구분하거나 위치 관계를 볼 다른 객체가 있을 때만 쓰고, 없으면 null.
    - relation_to_check: 두 객체 사이에서 관찰할 관계만 쓰고, 없으면 null.
    - requested_property: 관찰할 색상, 개수, 위치, 모양, 크기, 텍스트, 온도, 청결 상태 등의 속성. 없으면 null.
    - state_or_action_to_check: 행동이나 상태를 사실로 단정하지 말고 중립적인 관찰 항목만 쓰세요. 반드시 "~ 상태" 또는 "~ 여부" 형태로 작성하세요. "켜져 있음", "꺼져 있음", "밝음", "어두움", "지저분한 상태"처럼 예상 답을 쓰면 안 됩니다. 전원 질문에는 언제나 "전원 상태"를 쓰세요.
    - answer_type: yes_no, number, color, location, object, text, state, action, attribute, other 중 하나. yes_no는 예/아니오로 답하는 양자 질문에만 사용하세요. 날씨나 현재 상태를 묻는 "어때?" 질문은 state, 밝기·크기·모양 같은 속성값 질문은 attribute를 사용하세요. 날짜, 유통기한, 유효기간, 제조일자, 제품 코드, 가격, 시리얼 번호처럼 이미지에 적힌 문자·숫자 표기를 읽어야 하는 질문은 text를 사용하세요. other는 앞 유형으로 분류할 수 없을 때만 사용하세요. unanswerable은 금지합니다.
    - observation_target: 정답을 판단하기 위해 이미지에서 실제로 어디를, 무엇을 봐야 하는지 구체적으로 쓰세요. 예: "전자레인지 액정의 디지털 표시 영역", "피아노 전면 상단의 브랜드 표기 영역", "테이블 위 컵들이 모여 있는 영역", "질문 대상 객체와 기준 객체의 상대적 위치". 정답값 자체는 쓰지 마세요.
    - protected_answer_value: 증거 텍스트에 직접 쓰면 안 되는 "정답 변수의 의미"만 쓰세요. 실제 정답값이나 정답 후보는 절대 넣지 마세요. 잘못된 예: "3:00", "빨간색", "KURZWEIL", "3개", "예". 올바른 예: "액정에 표시된 숫자 문자열", "질문 대상의 구체적인 색상", "제품 회사명(브랜드 문자열)", "질문에서 요구하는 객체의 개수", "질문이 요구하는 최종 공간 관계", "질문 대상 객체의 정체(이름)". 즉 값이 아니라 "무엇에 해당하는 값인지"를 쓰세요.
    - evidence_to_preserve: 정답값을 노출하지 않으면서도 이미지에서 답을 찾는 데 도움이 되는 시각적 단서를 한국어 문자열 배열로 쓰세요. 예: ["대상의 이미지 내 위치", "표시 영역의 위치와 형태", "문자의 색상과 디지털 표시 형태"] 또는 ["질문 대상과 기준 객체의 식별 정보", "두 객체의 위치", "관계 판단에 필요한 공간적 단서"]. 가능하면 2개 이상 쓰되, 정답값 자체는 넣지 마세요.
    - 값은 answer_type을 제외하고 한국어로 작성하세요.
    - 이미지를 보지 않았으므로 실제로 보이는 내용을 단정하지 말고, 무엇을 봐야 하는지에 대한 지침만 쓰세요.

    예시 질문: 전자레인지 액정에 나와있는 숫자를 읽어주세요
    예시 출력:
    {
      "target_object": "전자레인지",
      "reference_object": null,
      "relation_to_check": null,
      "requested_property": "액정에 표시된 텍스트",
      "state_or_action_to_check": null,
      "answer_type": "text",
      "observation_target": "전자레인지 액정의 디지털 표시 영역",
      "protected_answer_value": "액정에 표시된 숫자 문자열",
      "evidence_to_preserve": ["전자레인지의 이미지 내 위치", "액정 표시 영역의 위치와 형태", "표시 문자의 색상과 디지털 표시 형태"]
    }

    예시 질문: 불이 켜져 있나요?
    예시 출력:
    {
      "target_object": "불",
      "reference_object": null,
      "relation_to_check": null,
      "requested_property": null,
      "state_or_action_to_check": "전원 상태",
      "answer_type": "yes_no",
      "observation_target": "조명 기구와 그 주변의 밝기 및 표시등",
      "protected_answer_value": "질문이 요구하는 최종 점등 여부(예/아니오)",
      "evidence_to_preserve": ["조명 기구의 이미지 내 위치", "전구나 표시등이 보이는 영역", "주변 밝기를 판단할 수 있는 시각적 단서"]
    }

    예시 질문: 실내가 어두운지 밝은지 알려주세요
    예시 출력:
    {
      "target_object": "실내 환경",
      "reference_object": null,
      "relation_to_check": null,
      "requested_property": "밝기",
      "state_or_action_to_check": null,
      "answer_type": "other",
      "observation_target": "실내 전반의 조명 상태와 창문, 그림자 영역",
      "protected_answer_value": "질문이 요구하는 밝기 정도에 대한 최종 판단",
      "evidence_to_preserve": ["창문과 조명의 위치", "그림자와 반사가 보이는 영역", "전반적인 노출을 판단할 수 있는 단서"]
    }

    Question:
    {question}

# ---------------------------------------------------------------------------------------
# Stage 2'  —  PROTECTED EVIDENCE  (image + protected decomposition; NO question, NO gold)
#   placeholders allowed: {decomposition_json}   (ONLY — a {question} here would be a leak)
# ---------------------------------------------------------------------------------------
protected_evidence:
  max_new_tokens: 300
  instruction: |
    아래 질문 구성요소를 참고하여 이미지를 직접 관찰하고, 정답 자체를 텍스트로 제공하지 않으면서 원본 이미지에서 정답을 판단하기 위해 어디를 보고 무엇을 확인해야 하는지가 보존된 시각적 증거를 자연스러운 한국어로 설명하세요.

    Question Components:
    {decomposition_json}

    목표:
    - 질문의 정답값 자체(protected_answer_value에 해당하는 구체적 값)는 쓰지 않는다.
    - 동시에 이미지에서 정답을 판단하는 데 필요한 위치, 기준 객체, 구분 가능한 시각적 특징, 확인해야 할 영역과 단서는 최대한 구체적으로 유지한다.
    - "질문에서 요구하는 값을 확인한다" 같은 빈 지시문으로 축소하지 않는다.

    핵심 원칙:
    1. 이미지에서 직접 관찰 가능한 내용만 작성한다.
    2. 질문 구성요소(특히 observation_target, evidence_to_preserve)는 이미지에서 어떤 대상·영역·관계를 중심으로 관찰할지 정하기 위한 지침으로만 사용한다.
    3. protected_answer_value에 해당하는 구체적인 값이나 그 값에 대한 최종 결론을 직접 작성하지 않는다.
    4. 대신 다음 정보는 최대한 유지한다: 대상의 위치, 기준 객체, 이미지 내 위치, 주변 객체, 모양·표면·질감 등 시각적 단서, 비교 축, 관계 판단에 필요한 비결론적 공간 정보, 텍스트가 존재하는 위치와 영역, 상태 판단에 필요한 가시적 표시.
    5. 질문 구성요소에 적힌 내용을 실제 이미지의 사실로 가정하지 않는다.
    6. 이미지에서 식별할 수 없는 내용은 추측하지 않는다.
    7. 외부 지식이나 상식으로 이미지에 없는 정보를 추가하지 않는다.
    8. 정답 후보를 나열하거나 비교·관계의 최종 결론을 미리 작성하지 않는다. 존재/유무/상태에 대한 긍정·부정 판단도 미리 내리지 않는다.
    9. 질문이 요구하는 값과 무관한 시각 정보는 protected_answer_value를 노출하지 않는 범위에서 구체적으로 유지할 수 있다.
    10. Yes, No, unanswerable 같은 QA 정답 형식으로 작성하지 않는다.
    11. 1~3개의 자연스러운 한국어 문장만 출력한다.

    answer_type별 추가 규칙:
    - text: observation_target이 가리키는 문자열/표기(브랜드명, 숫자 표시, 날짜·유통기한·유효기간·제품 코드·가격·시리얼 번호 등)를 그대로 옮겨 적지 않는다. 그 문자열이 있는 영역의 위치, 색상, 표시 형태, 대략적인 길이 같은 형태적 단서만 설명한다.
    - color / attribute: 질문이 요구하는 구체적인 색·재질·형태 값을 직접 말하지 않는다. 대상의 위치와, 그 속성을 직접 확인할 수 있는 표면·영역을 가리킨다.
    - number: 최종 개수를 쓰지 않는다. 또한 객체를 하나씩 모두 나열해 사실상 개수를 제공하지 않는다. 세어야 할 객체들이 모여 있는 영역과 구분 기준만 설명한다.
    - state / action / yes_no: 최종 상태나 예/아니오 결론을 쓰지 않는다. "켜져 있다 / 꺼져 있다 / 열려 있다 / 닫혀 있다 / 있다 / 없다 / 존재하지 않는다 / 우거져 있다 / 불투명하다 / 투명하다 / 높다 / 낮다"처럼 상태를 단정하는 서술어를 "확인할 수 있다 / 확인된다 / 보인다 / 것으로 보인다 / 임을 확인할 수 있다 / 음을 확인할 수 있다"와 결합해 쓰지 않는다. 상태를 판단할 수 있는 표시등·디스플레이·자세·그림자·질감·밀도 등 가시적 단서가 이미지의 어느 위치에 있는지만 설명하고, 판단 자체는 남겨 둔다. 나쁜 예: "기기의 전원이 켜져 있는 것을 확인할 수 있다." 좋은 예: "기기 전면에 표시등과 디스플레이 영역이 있으며, 점등 여부는 이 부분을 확인해야 한다."
    - location / relation: 질문이 요구하는 최종 공간 관계를 쓰지 않는다. 두 객체가 함께 보이는 영역과, 상대 위치를 비교할 수 있다는 사실 및 비교에 필요한 기준만 설명한다. 절대적 이미지 위치는 유지할 수 있다.
    - object: 질문이 요구하는 정답 객체의 이름을 쓰지 않는다. 대상의 이미지 내 위치와 손잡이·주둥이·바퀴 같은 형태적 특징만 설명한다.

    출력에는 시각적 증거 설명만 작성한다.
